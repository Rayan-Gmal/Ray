<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ray</title>
<meta name="theme-color" content="#191D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ray">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#191D3E;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F4F9}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#191D3E;color:#fff;font-family:system-ui,Tahoma,sans-serif;transition:opacity .4s}
#splash img{width:96px;height:96px}
#splash.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" title="Ray" allow="clipboard-write"></iframe>
<div id="splash"><img src="icon-192.png" alt=""><div>Ray · نظام إدارة المخازن والتجهيز</div></div>
<script>
var APP = 'https://script.google.com/macros/s/AKfycbxDoDZvOjM3PbnUue0STDechP11MBwBCDf5GFSO5rEs0bbjYn4izqcZPDgIv_0KqTcIZw/exec';
var v = new URLSearchParams(location.search).get('v') || 'dash';
var f = document.getElementById('app');
f.src = APP + '?v=' + encodeURIComponent(v);
f.onload = function () { setTimeout(function () { document.getElementById('splash').classList.add('hide'); }, 600); };
setTimeout(function () { document.getElementById('splash').classList.add('hide'); }, 8000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
